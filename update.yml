name: update-profile
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/build-heatmap.mjs
        env:
          GH_USER: MuhammadMuzammil-TheDeveloper
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "profile-bot" && git config user.email "bot@users.noreply.github.com"
          git add contrib-heatmap.svg && (git diff --cached --quiet || git commit -m "chore: sync contribution heatmap" && git push)
